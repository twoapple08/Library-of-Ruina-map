name: build

# 월드 빌드: 실제 마인크래프트 서버(최신 정식)로 월드를 만들고 검증 → 그 건축물을 담아 모드(Fabric) 빌드
# → 실제 클라이언트로 게임 테스트(아이템 사용·이동·도착 화면 스크린샷) → 릴리스(world-latest)에 올린다.
# 결과 보고서·로그·스크린샷은 ci-output 브랜치에 올라간다 (world/, mod/).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "world = 월드 빌드, probe = 포맷 프로브"
        type: choice
        options: [world, probe]
        default: world
      mc_version:
        description: "마인크래프트 버전 (비우면 gradle.properties의 고정 버전)"
        required: false
        default: ""
      game_test:
        description: "건축 완료 후 최종 클라이언트 검사 (일반 푸시에서는 실행하지 않음)"
        type: boolean
        default: false
      shader_test:
        description: "BSL 테스트/팩 생성 (현재 작업 범위 밖, 기본 중단)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "builders/**"
      - "tools/**"
      - "config.py"
      - "ref/**"
      - "resourcepack/**"
      - "shaderpack/**"
      - "mod/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true  # 최신 소스 빌드가 이전 커밋의 실패 예정 월드 생성을 대체

env:
  TASK: ${{ inputs.task || 'world' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 파이썬 패키지
        run: pip install numpy pillow

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 서버 jar 받기
        id: mc
        env:
          MC_VERSION_INPUT: ${{ inputs.mc_version }}
        run: |
          MC_VERSION_DEFAULT=$(sed -n 's/^minecraft_version=//p' mod/gradle.properties)
          python -m tools.ci fetch "${MC_VERSION_INPUT:-$MC_VERSION_DEFAULT}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      - name: 참고 파일 추출 (version.json, 바닐라 JSON, 블록 목록)
        run: |
          python -m tools.ci refs
          python -m tools.ci reports
          python -m tools.ci colors || echo "::warning::블록 색 추출 실패 (미리보기용이라 계속 진행)"

      - name: 포맷 프로브
        if: env.TASK == 'probe'
        run: python -m tools.ci probe

      - name: 월드 빌드 (건축물 코드가 그대로면 릴리스의 것 재사용, tools/world_cache.py)
        if: env.TASK == 'world'
        run: python -m tools.world_cache fetch || { python -m tools.ci world && python -m tools.world_cache save; }

      - uses: gradle/actions/setup-gradle@v6
        if: env.TASK == 'world'

      - name: 배포 소스·건축 데이터 지문 기록
        if: env.TASK == 'world'
        run: python -m tools.release_verify prepare

      - name: 모드 빌드
        if: env.TASK == 'world'
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: JAR 내부 소스·건축 데이터 검증
        if: env.TASK == 'world'
        run: |
          mkdir -p out/release
          cp mod/build/libs/Ruina-*.jar out/release/Ruina.jar
          python -m tools.release_verify verify out/release/Ruina.jar --manifest out/release/Ruina-build.json

      - uses: actions/upload-artifact@v4
        if: env.TASK == 'world'
        with:
          name: Ruina-${{ github.sha }}
          path: |
            out/release/Ruina.jar
            out/release/Ruina-build.json

      - name: 모드 게임 테스트 (실제 클라이언트, 가상 화면)
        id: gametest
        if: env.TASK == 'world' && inputs.game_test == true
        continue-on-error: true     # 실패해도 모드는 올리고, 결과는 릴리스 노트·ci-output/mod 에
        working-directory: mod
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers
          mkdir -p build/run/clientGameTest
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest 2>&1 | tee build/gametest_gradle.log

      - name: 모드 게임 테스트 — 셰이더 (Iris + Sodium + 맵 전용 BSL, 몇 곳만)
        id: gametest_bsl
        if: env.TASK == 'world' && inputs.shader_test == true
        continue-on-error: true
        timeout-minutes: 45
        working-directory: mod
        run: |
          (cd .. && python -m tools.shaderpack)   # 테스트 모드(ShaderSetup)가 이 팩을 넣고 Iris 를 켬
          R=build/run/clientGameTest              # 테스트 시작 때 비워짐 → 바닐라 판 결과를 먼저 옮김
          mkdir -p build/vanilla && cp -r $R/screenshots $R/ruina_test.txt $R/logs/latest.log build/vanilla/ || true
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Pshaders 2>&1 | tee build/gametest_bsl_gradle.log

      - name: 게임 테스트 결과 정리 (스크린샷 → jpg)
        if: ${{ !cancelled() && env.TASK == 'world' }}
        env:
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          GAMETEST_BSL_OUTCOME: ${{ steps.gametest_bsl.outcome }}
        run: python -m tools.ci modtest

      - name: 릴리스(world-latest)에 모드·월드 올리기
        if: env.TASK == 'world' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=world-latest
          # 데이터팩 시절 마지막 월드(4차 테스트 통과)는 따로 보관 (한 번만)
          if ! gh release view world-datapack-final >/dev/null 2>&1 && gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p backup && gh release download "$TAG" -D backup
            gh release create world-datapack-final backup/* --title "데이터팩 시절 마지막 월드 (4차 테스트 통과, 백업)" \
              --notes "모드화 전 마지막 월드 파일·리소스팩·BSL. 이제는 world-latest 의 모드(Ruina.jar)를 쓰세요." --target "${{ github.sha }}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "최신 월드 (자동 빌드)" --notes "준비 중" --target "${{ github.sha }}"
          cp mod/build/libs/Ruina-*.jar out/release/Ruina.jar
          FAPI=$(grep '^fabric_api_version=' mod/gradle.properties | cut -d= -f2)
          curl -fsSL -o "out/release/fabric-api-$FAPI.jar" \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
          gh release upload "$TAG" out/release/Ruina.jar out/release/Ruina-build.json "out/release/fabric-api-$FAPI.jar" --clobber
          for f in Library-of-Ruina.zip Ruina_resources.zip Ruina_generated.zip; do   # 월드를 재사용한 실행에는 없음
            [ -f "out/release/$f" ] && gh release upload "$TAG" "out/release/$f" --clobber
          done
          # BSL 작업 중단: 일반 main 푸시는 셰이더팩을 만들거나 배포하지 않는다.
          if [ "${{ inputs.shader_test }}" = true ]; then
            [ -f out/release/BSL_v10.1.6_Ruina.zip ] || python -m tools.shaderpack
            gh release upload "$TAG" out/release/BSL_v10.1.6_Ruina.zip --clobber
          fi
          {
            echo "자동 빌드: $(date -u +%F' '%H:%M) UTC / Minecraft ${{ steps.mc.outputs.mc_version }} / 커밋 ${GITHUB_SHA::7}"
            echo
            cat ci_out/mod/SUMMARY.md 2>/dev/null || true
            echo
            cat ci_out/world/SUMMARY.md 2>/dev/null || echo "건축물: 코드가 그대로라 지난 빌드 재사용"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          # 실제 내려받은 바이트까지 확인한다. 실패 시 배포 완료로 보고하지 않는다.
          mkdir -p out/download-check
          gh release download "$TAG" -p Ruina.jar -D out/download-check --clobber
          python -m tools.release_verify verify out/download-check/Ruina.jar --manifest out/download-check/Ruina-build.json
          cmp out/release/Ruina-build.json out/download-check/Ruina-build.json

      - name: 결과를 ci-output 브랜치에 올리기
        if: ${{ !cancelled() }}     # 취소된 실행은 올리지 않음 (지난 스크린샷이 지워지지 않게)
        run: |
          [ -d ci_out ] || exit 0
          cd ci_out
          echo "run ${{ github.run_id }} / $TASK / mc ${{ steps.mc.outputs.mc_version }} / commit ${GITHUB_SHA::7} / $(date -u +%FT%TZ)" > RUN.txt
          git init -q
          git checkout -q -b ci-output
          git add -A
          git -c user.name="ruina-ci" -c user.email="ruina-ci@users.noreply.github.com" commit -qm "CI $TASK run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
