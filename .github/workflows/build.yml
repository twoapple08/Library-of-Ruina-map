name: build

# 월드 빌드: 실제 마인크래프트 서버(최신 정식)로 월드를 만들고 검증한 뒤 릴리스(world-latest)에 올린다.
# 결과 보고서·로그는 ci-output 브랜치에 올라간다.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "world = 월드 빌드, probe = 포맷 프로브"
        type: choice
        options: [world, probe]
        default: world
      mc_version:
        description: "마인크래프트 버전 (비우면 최신 정식)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "builders/**"
      - "tools/**"
      - "config.py"
      - "ref/**"
      - "resourcepack/**"
      - "shaderpack/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  TASK: ${{ inputs.task || 'world' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 파이썬 패키지
        run: pip install numpy pillow

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 서버 jar 받기
        id: mc
        run: python -m tools.ci fetch "${{ inputs.mc_version }}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      - name: 참고 파일 추출 (version.json, 바닐라 JSON, 블록 목록)
        run: |
          python -m tools.ci refs
          python -m tools.ci reports
          python -m tools.ci colors || echo "::warning::블록 색 추출 실패 (미리보기용이라 계속 진행)"

      - name: 포맷 프로브
        if: env.TASK == 'probe'
        run: python -m tools.ci probe

      - name: 월드 빌드
        if: env.TASK == 'world'
        run: python -m tools.ci world

      - name: 릴리스(world-latest)에 월드 올리기
        if: env.TASK == 'world' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=world-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "최신 월드 (자동 빌드)" --notes "준비 중" --target "${{ github.sha }}"
          gh release upload "$TAG" out/release/Library-of-Ruina.zip --clobber
          python -m tools.shaderpack                      # 맵 전용 BSL 개조판
          gh release upload "$TAG" out/release/BSL_v10.1.6_Ruina.zip --clobber
          {
            echo "자동 빌드: $(date -u +%F' '%H:%M) UTC / Minecraft ${{ steps.mc.outputs.mc_version }} / 커밋 ${GITHUB_SHA::7}"
            echo
            cat ci_out/world/SUMMARY.md
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: 결과를 ci-output 브랜치에 올리기
        if: always()
        run: |
          [ -d ci_out ] || exit 0
          cd ci_out
          echo "run ${{ github.run_id }} / $TASK / mc ${{ steps.mc.outputs.mc_version }} / commit ${GITHUB_SHA::7} / $(date -u +%FT%TZ)" > RUN.txt
          git init -q
          git checkout -q -b ci-output
          git add -A
          git -c user.name="ruina-ci" -c user.email="ruina-ci@users.noreply.github.com" commit -qm "CI $TASK run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
