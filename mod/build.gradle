// 라이브러리 오브 루이나 도서관 모드 (Fabric 26.3). 빌드는 GitHub Actions 에서 (.github/workflows/build.yml).
// 생성 리소스(데이터팩·소리·건축물)는 CI 월드 빌드가 build/generated/ruina 에 만든다 (tools/mod_pack.py).
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'ruina'

base {
	archivesName = 'Ruina'
}

sourceSets.main.resources.srcDir 'build/generated/ruina'

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// 실제 게임 클라이언트를 띄워 아이템 사용·이동을 해 보고 도착 화면을 찍는다 (./gradlew runClientGameTest)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'ruina-test'
		enableGameTests = false
		eula = true
	}
}

// -Pshaders: 게임 테스트를 Iris + Sodium 으로 (맵 전용 BSL 확인용, 모드 jar 에는 안 들어감). gametest 소스셋이 생긴 뒤라 여기
if (project.hasProperty('shaders')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
	// 실행 폴더는 테스트 시작 때 비워짐 → 테스트 모드(ShaderSetup)가 이 경로의 팩을 넣고 Iris 를 켬 (먼저 python -m tools.shaderpack)
	tasks.named('runClientGameTest') {
		jvmArgs "-Druina.shaderpack=${rootProject.projectDir.parentFile}/out/release/BSL_v10.1.6_Ruina.zip"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
